<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BF — Планета полная разлук</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231a1a2e'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='sans-serif' font-size='18' font-weight='bold' fill='%234488ff'%3EЭЖ%3C/text%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { display: flex; justify-content: center; align-items: center; flex-direction: column; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; }

  #loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    color: #4488ff;
    font-family: sans-serif;
  }
  #loader .label {
    font-size: 14px;
    opacity: 0.7;
  }
  #loader .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #1a1a2e;
    border-top-color: #4488ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
<script src="wasm_exec.js"></script>
<script>
"use strict";
(async () => {
  const loader = document.createElement('div');
  loader.id = 'loader';
  loader.innerHTML = '<div class="spinner"></div><div class="label">Загрузка игры…</div>';
  document.body.appendChild(loader);

  const resp = await fetch("game.wasm");
  if (!resp.ok) {
    loader.innerHTML = '<pre style="color:#f44">' + await resp.text() + '</pre>';
    return;
  }

  const go = new Go();
  go.argv = ["game.wasm"];
  const result = await WebAssembly.instantiateStreaming(resp, go.importObject);
  loader.remove();
  go.run(result.instance);
})();
</script>
