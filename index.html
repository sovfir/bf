<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BF — Планета полная разлук</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='36' fill='%23cc0000' font-family='system-ui,-apple-system,sans-serif' font-weight='700'%3E%D0%91%D0%A4%3C/text%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden; background: #000;
    overscroll-behavior: none;
    -webkit-overflow-scrolling: auto;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  #loading {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #000;
    z-index: 100;
    color: #aaa;
    transition: opacity 0.5s ease;
  }
  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #loading h1 {
    font-size: 1.6em;
    font-weight: 200;
    letter-spacing: 0.3em;
    margin-bottom: 2.5em;
    color: #555;
    text-transform: uppercase;
  }
  .progress-track {
    width: 260px;
    max-width: 70vw;
    height: 3px;
    background: #1a1a1a;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #801020, #cc2040);
    border-radius: 2px;
    transition: width 0.15s ease;
  }
  .progress-text {
    margin-top: 1em;
    font-size: 0.8em;
    color: #333;
    font-variant-numeric: tabular-nums;
  }
  canvas {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    image-rendering: auto;
  }
</style>
<script src="wasm_exec.js"></script>

<div id="loading">
  <h1>BF</h1>
  <div class="progress-track"><div class="progress-bar" id="bar"></div></div>
  <div class="progress-text" id="progress-text">Загрузка...</div>
</div>

<script>
"use strict";

const loading = document.getElementById('loading');
const bar = document.getElementById('bar');
const progressText = document.getElementById('progress-text');

(async () => {
  const resp = await fetch('game.wasm');
  const contentLength = +resp.headers.get('Content-Length');
  const reader = resp.body.getReader();
  const chunks = [];
  let received = 0;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    if (contentLength) {
      const pct = Math.round((received / contentLength) * 100);
      bar.style.width = pct + '%';
      progressText.textContent = 'Загрузка… ' + pct + '%';
    } else {
      const mb = (received / (1024 * 1024)).toFixed(1);
      progressText.textContent = 'Загрузка… ' + mb + ' MB';
    }
  }

  const blob = new Blob(chunks, { type: 'application/wasm' });
  const wasmBytes = await blob.arrayBuffer();

  loading.classList.add('hidden');

  const go = new Go();
  const result = await WebAssembly.instantiate(wasmBytes, go.importObject);
  go.run(result.instance);
})().catch(err => {
  loading.classList.add('hidden');
  const msg = document.createElement('p');
  msg.style.cssText = 'color:#f55;font-family:sans-serif;padding:2em;text-align:center';
  msg.textContent = 'Ошибка загрузки: ' + err;
  document.body.innerHTML = '';
  document.body.appendChild(msg);
  console.error(err);
});
</script>
