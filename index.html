<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BF — Планета полная разлук</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-C1S2Y3109M"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-C1S2Y3109M');
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { display: flex; justify-content: center; align-items: center; position: relative; }
  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    color: #4488ff; font-family: sans-serif;
  }
  #loading .spinner {
    width: 36px; height: 36px;
    border: 3px solid #1a1a2e;
    border-top-color: #4488ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .percent {
    font-size: 28px; font-weight: bold;
    color: #4488ff;
    font-variant-numeric: tabular-nums;
  }
  #loading .bar-track {
    width: 200px; height: 4px;
    background: #1a1a2e;
    border-radius: 2px;
    overflow: hidden;
  }
  #loading .bar-fill {
    height: 100%; width: 0%;
    background: #4488ff;
    border-radius: 2px;
    transition: width 0.15s ease;
  }
  #loading .label {
    font-size: 14px; opacity: 0.7;
  }
  canvas ~ #loading { display: none; }
</style>
<div id="loading">
  <div class="spinner"></div>
  <div class="percent" id="pct">0%</div>
  <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
  <div class="label">Грузим электрических жирафов</div>
</div>
<script src="wasm_exec.js"></script>
<script>
"use strict";
(async () => {
  // XHR with real progress — more reliable than fetch+ReadableStream.
  const pctEl = document.getElementById('pct');
  const barEl = document.getElementById('bar');
  const labelEl = document.querySelector('#loading .label');

  const buf = await new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', 'game.wasm', true);
    xhr.responseType = 'arraybuffer';
    xhr.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const pct = Math.min(99, Math.round(e.loaded / e.total * 100));
      pctEl.textContent = pct + '%';
      barEl.style.width = pct + '%';
    };
    xhr.onload = () => {
      if (xhr.status === 200) resolve(xhr.response);
      else reject(new Error('HTTP ' + xhr.status));
    };
    xhr.onerror = () => reject(new Error('Network error'));
    xhr.send();
  });

  labelEl.textContent = 'Компиляция…';
  pctEl.textContent = '99% ✓';
  barEl.style.width = '99%';

  const go = new Go();
  go.argv = ['game.wasm'];
  const result = await WebAssembly.instantiate(buf, go.importObject);
  document.getElementById('loading').remove();
  go.run(result.instance);
})();
</script>
</html>
