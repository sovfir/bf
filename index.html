<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BF — Планета полная разлук</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { display: flex; justify-content: center; align-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; }

  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    color: #4488ff; font-family: sans-serif;
  }
  #loading .spinner {
    width: 36px; height: 36px;
    border: 3px solid #1a1a2e;
    border-top-color: #4488ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .label {
    font-size: 14px; opacity: 0.7;
  }
  canvas ~ #loading { display: none; }
</style>
<div id="loading">
  <div class="spinner"></div>
  <div class="label">Загрузка игры…</div>
</div>
<script src="wasm_exec.js"></script>
<script>
"use strict";
(async () => {
  const resp = await fetch("game.wasm");
  if (!resp.ok) {
    const pre = document.createElement('pre');
    pre.innerText = await resp.text();
    document.body.appendChild(pre);
    return;
  }
  const go = new Go();
  go.argv = ["game.wasm"];
  const result = await WebAssembly.instantiateStreaming(resp, go.importObject);
  go.run(result.instance);
})();
</script>
