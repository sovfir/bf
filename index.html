<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BF — Планета полная разлук</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { display: flex; justify-content: center; align-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; }

  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    color: #4488ff; font-family: sans-serif;
  }
  #loading .spinner {
    width: 36px; height: 36px;
    border: 3px solid #1a1a2e;
    border-top-color: #4488ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .percent {
    font-size: 28px; font-weight: bold;
    color: #4488ff;
    font-variant-numeric: tabular-nums;
  }
  #loading .label {
    font-size: 14px; opacity: 0.7;
  }
  canvas ~ #loading { display: none; }
</style>
<div id="loading">
  <div class="spinner"></div>
  <div class="percent" id="pct">0%</div>
  <div class="label">Грузим электрических жирафов</div>
</div>
<script src="wasm_exec.js"></script>
<script>
"use strict";
(async () => {
  const resp = await fetch("game.wasm");
  if (!resp.ok) {
    const pre = document.createElement('pre');
    pre.innerText = await resp.text();
    document.body.appendChild(pre);
    return;
  }
  const total = parseInt(resp.headers.get('Content-Length') || '0', 10);
  const pctEl = document.getElementById('pct');
  const reader = resp.body.getReader();
  const chunks = [];
  let received = 0;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    if (total > 0) {
      pctEl.textContent = Math.min(99, Math.round(received / total * 100)) + '%';
    } else {
      pctEl.textContent = Math.round(received / 1024) + ' KB';
    }
  }

  // собираем буфер
  const buf = new Uint8Array(received);
  let off = 0;
  for (const c of chunks) { buf.set(c, off); off += c.length; }

  const go = new Go();
  go.argv = ["game.wasm"];
  const result = await WebAssembly.instantiate(buf.buffer, go.importObject);
  document.getElementById('loading').remove();
  go.run(result.instance);
})();
</script>
</html>
